name: IG Cookie Bot

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: ig-cookie-bot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Chromium
        run: |
          pip install -r requirements-cookie-bot.txt
          playwright install --with-deps chromium

      - name: Refresh Instagram cookies
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # Bootstrap only — bot prefers live backend/Render cookies when available
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNTS_JSON: ${{ secrets.IG_ACCOUNTS_JSON }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          COOKIE_BOT_ADMIN_KEY: ${{ secrets.COOKIE_BOT_ADMIN_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOOPHOLE_API_KEY: ${{ secrets.LOOPHOLE_API_KEY }}
          COOKIE_BOT_SMOKE_URL: ${{ secrets.COOKIE_BOT_SMOKE_URL }}
        run: python ig_cookie_bot.py

      - name: Slack alert on workflow failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":":x: *IG Cookie Bot workflow failed* — check GitHub Actions logs for loophole-backend."}'
