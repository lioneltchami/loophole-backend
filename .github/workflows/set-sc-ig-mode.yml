name: Set SCRAPECREATORS_IG_MODE

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "primary | fallback | off | peek"
        required: true
        default: "fallback"
        type: choice
        options:
          - primary
          - fallback
          - off
          - peek

permissions:
  contents: read

jobs:
  set-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set env + restart OR peek logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_WEB_SERVICE_ID}"

          echo "Current MODE env:"
          curl -fsS -H "${AUTH}" -H "Accept: application/json" \
            "${BASE}/env-vars/SCRAPECREATORS_IG_MODE"
          echo

          curl -fsS -H "${AUTH}" -H "Accept: application/json" \
            "${BASE}" > /tmp/svc.json
          python3 -c "import json;d=json.load(open('/tmp/svc.json'));s=d.get('service') or d;print('service',s.get('name'),'owner',s.get('ownerId'));open('/tmp/owner','w').write(s.get('ownerId') or '')"
          OWNER=$(cat /tmp/owner)

          if [ "${MODE}" = "peek" ]; then
            echo "PEEK ONLY — no restart"
          else
            echo "PUT SCRAPECREATORS_IG_MODE=${MODE}"
            curl -fsS -X PUT "${BASE}/env-vars/SCRAPECREATORS_IG_MODE" \
              -H "${AUTH}" -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "{\"value\":\"${MODE}\"}"
            echo
            echo "Restart"
            curl -fsS -X POST "${BASE}/restart" -H "${AUTH}" -H "Accept: application/json"
            echo
          fi

          echo "=== recent deploys ==="
          curl -fsS -H "${AUTH}" "${BASE}/deploys?limit=5" | python3 -c "import sys,json;d=json.load(sys.stdin);
for x in d[:5]:
  dep=x.get('deploy') or x
  print(dep.get('status'), dep.get('finishedAt') or dep.get('createdAt'), ((dep.get('commit') or {}).get('message') or '')[:70])"

          echo "=== logs last 12h (extract-related) ==="
          START=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-12H +%Y-%m-%dT%H:%M:%SZ)
          curl -sS -G -H "${AUTH}" "https://api.render.com/v1/logs" \
            --data-urlencode "ownerId=${OWNER}" \
            --data-urlencode "resource=${RENDER_WEB_SERVICE_ID}" \
            --data-urlencode "limit=100" \
            --data-urlencode "startTime=${START}" > /tmp/logs.json
          python3 -c "import json,re; raw=open('/tmp/logs.json').read(); print('raw_head',raw[:250]); d=json.loads(raw); logs=d if isinstance(d,list) else (d.get('logs') or d.get('entries') or d.get('events') or []); print('n_logs',len(logs)); pat=re.compile(r'scrapecreators|ScrapeCreators|Primary video|Fallback video|Instagram blocked|yt-dlp|_extractor|Trying Scrape|embed scraper', re.I); n=0
for e in logs:
  msg=(e.get('message') if isinstance(e,dict) else str(e)) or ''; ts=(e.get('timestamp') if isinstance(e,dict) else '') or ''
  if pat.search(msg):
    print(ts, msg[:420]); n+=1
print('matched',n); print('--- LAST 25 ---');
[print(((e.get('timestamp') if isinstance(e,dict) else '') or ''), ((e.get('message') if isinstance(e,dict) else str(e)) or '')[:280]) for e in logs[-25:]]"
