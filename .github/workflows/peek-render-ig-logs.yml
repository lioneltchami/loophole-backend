name: Peek Render IG extract logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mode and logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: python3 scripts/peek_render_ig_logs.py
